server:
  port: ${PORT:8080}

spring:
  main:
    lazy-initialization: true

services:
  identity:
    baseUrl: ${IDENTITY_BASE_URL:http://localhost:8082}
  applications:
    baseUrl: ${APPLICATIONS_BASE_URL:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}

inter:
  service:
    secret: ${INTER_SERVICE_SECRET}

